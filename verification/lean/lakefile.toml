name = "auric-verification"
version = "0.1.0"
defaultTargets = ["provider-policy-oracle", "launch-gate-oracle", "agent-ids-oracle", "pm-scope-oracle"]

[[lean_lib]]
name = "AuricIDE"

[[lean_exe]]
name = "provider-policy-oracle"
root = "AuricIDE.ProviderPolicyOracle"

[[lean_exe]]
name = "launch-gate-oracle"
root = "AuricIDE.LaunchGateOracle"

[[lean_exe]]
name = "agent-ids-oracle"
root = "AuricIDE.AgentIdsOracle"

[[lean_exe]]
name = "pm-scope-oracle"
root = "AuricIDE.PmScopeOracle"

[[lean_exe]]
name = "agent-questions-oracle"
root = "AuricIDE.AgentQuestionsOracle"

[[lean_exe]]
name = "agent-report-oracle"
root = "AuricIDE.AgentReportOracle"
