# Supply-chain policy: resolve only releases that have aged for seven days,
# and reject dependencies that smuggle non-registry sources into their graph.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: false
blockExoticSubdeps: true
allowBuilds:
  better-sqlite3: true
  bun: true
  edgedriver: false
  esbuild: true
  geckodriver: false
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  tldjs: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  # Temporary WDIO bootstrap waiver. Owner: AuricIDE maintainers. Remove after
  # 2026-10-02, once the pinned packages satisfy the normal seven-day policy.
  - '@wdio/cli@9.32.0'
  - '@wdio/config@9.32.0'
  - '@wdio/dot-reporter@9.32.0'
  - '@wdio/local-runner@9.32.0'
  - '@wdio/mocha-framework@9.32.0'
  - '@wdio/reporter@9.32.0'
  - '@wdio/runner@9.32.0'
  - '@wdio/types@9.32.0'
  - '@wdio/utils@9.32.0'
  - '@wdio/xvfb@9.32.0'
  - create-wdio@9.32.0
  - webdriver@9.32.0
  - webdriverio@9.32.0
