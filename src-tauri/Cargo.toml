[package]
name = "auric-ide"
version = "0.1.0"
description = "AuricIDE – AI-native Markdown editor"
authors = ["Jörg Amelunxen"]
license = "AGPL-3.0-only"
repository = "https://github.com/j-amelunxen/AuricIDE"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# The WDIO plugins expose an in-process evaluator and embedded WebDriver
# server. They must only be linked into the dedicated native E2E artifact.
e2e-webdriver = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.10.0", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-wdio = { version = "1.4.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.4.0", optional = true }
walkdir = "2"
git2 = "0.19"
notify = "8.0"
base64 = "0.22"
sha2 = "0.10"
serde_yaml = "0.9"
semver = "1"
portable-pty = "0.9"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt", "time"] }
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
dirs = "5"
tempfile = "3"
serde_json = "1.0.149"
serde_path_to_error = "0.1"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
cron = "0.17.0"
chrono-tz = "0.10.4"
uuid = { version = "1", features = ["v4"] }
regex = "1"
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time"] }

# Dependencies carry no debug info in dev builds. Their full DWARF made up most of
# target/debug (one objc2-app-kit rlib alone was 150 MB), and stepping into a
# dependency is rare enough that a release-style backtrace there is fine.
# Our own crate keeps full debug info.
[profile.dev.package."*"]
debug = false
